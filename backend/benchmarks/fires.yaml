    horizons: [10, 24]
    observed:
      - {hours: 10, acres: 10000, at: "2019-10-24T07:30:00-07:00", confidence: low, source: "CAL FIRE morning update Oct 24 2019 (10,000 ac) as reported in press; verify"}
      - {hours: 24, acres: 16000, at: "2019-10-24T21:30:00-07:00", confidence: low, source: "CAL FIRE evening update Oct 24 2019 (16,000 ac) as reported in press; verify"}
    perimeter: {nifc_incident: KINCADE, fire_year: "2019", expected_acres: 77758}
    notes: Diablo (NE) wind event, single origin, night ignition. Horizon 10 is scored from the 12 h run's 10 h ring.

  - key: tubbs2017
    name: Tubbs Fire
    state: CA
    ignition: {lat: 38.6131, lon: -122.6204}
    ignition_time: "2017-10-08T21:43:00-07:00"
    ignition_source: >-
      CAL FIRE investigation (2019-01-24): private electrical system at 1128 Bennett
      Lane, Calistoga; started about 21:43 on Oct 8, 2017.
      https://www.fire.ca.gov/incidents/2017/10/8/tubbs-fire/ Coordinates approximate: Bennett Lane
      runs north off Tubbs Lane north-west of Calistoga. A first guess of -122.5472 fell 5.2 km
      east of the NIFC perimeter and was moved to a point 400 m inside the nearest lobe of the NIFC perimeter
      (an interior point, not the true origin, which may be up to 1.5 km away).
    horizons: [6, 12]
    observed:
      - {hours: 6, acres: 20000, at: "2017-10-09T03:45:00-07:00", confidence: low, source: "fire reached Coffey Park, Santa Rosa (about 19 km) by about 02:00 to 03:00 Oct 9; CAL FIRE reported roughly 20,000 ac by early morning; recalled, verify"}
      - {hours: 12, acres: 25000, at: "2017-10-09T09:45:00-07:00", confidence: low, source: "CAL FIRE Oct 9 2017 morning update (about 25,000 ac) as reported in press; verify"}
    perimeter: {nifc_incident: TUBBS, fire_year: "2017", expected_acres: 36807}
    notes: Diablo (NE) wind event; the fire crossed Highway 101 into Santa Rosa within about 4 h.

