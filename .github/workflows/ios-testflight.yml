# Build the Hotshot iOS app on a GitHub macOS runner and upload it to TestFlight.
#
# No Xcode on the dev Mac is needed. Runs on every push to main that touches the
# front end, and on demand. Secrets (Settings > Secrets and variables > Actions):
#   APPSTORE_ISSUER_ID       App Store Connect > Users and Access > Integrations > Issuer ID
#   APPSTORE_KEY_ID          the API key's Key ID
#   APPSTORE_PRIVATE_KEY     the .p8 file contents (Team key, role App Manager)
#   IOS_DIST_CERT_P12_BASE64 Apple Distribution certificate exported as .p12, base64
#   IOS_DIST_CERT_PASSWORD   the .p12 password
#   APPLE_TEAM_ID            10-character team id from developer.apple.com > Membership
# The provisioning profile is fetched with the API key, so it never has to be
# stored. Create one App Store profile for com.nbtechai.hotshot once, in the portal.
name: iOS TestFlight

# Manual only until the Apple secrets exist. Once they do, add back:
#   push:
#     branches: [main]
#     paths: ["frontend/**", ".github/workflows/ios-testflight.yml"]
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app
        run: |
          npm ci --no-audit --no-fund
          CI=true GENERATE_SOURCEMAP=false npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.nbtechai.hotshot
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Build number from run
        run: |
          BUILD=$(( ${{ github.run_number }} ))
          cd ios/App && /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist
          echo "Build number $BUILD"

      - name: Archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1 | xargs -I{} sh -c 'security cms -D -i "{}" | plutil -extract Name raw -')" \
            archive | tail -40

      - name: Export IPA
        run: |
          cd ios/App
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist | tail -20
          ls -la build/ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: frontend/ios/App/build/ipa/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
